<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Démineur — Rob</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .outils { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(10px, 2vh, 18px); padding: var(--marge) var(--marge) 0; }
    .compteur { font: clamp(0.7rem, 2.2vh, 0.9rem) var(--pixel); color: var(--rouge); background: #000; padding: 0.45rem 0.6rem; border: 2px solid #3a1020; text-shadow: 0 0 8px var(--rouge); min-width: 4.4em; text-align: center; }
    #btn-visage { --c: var(--jaune); font-size: clamp(1rem, 3vh, 1.4rem); }
    #btn-drapeau { --c: var(--rose); }
    .message-jeu { font: clamp(0.6rem, 1.8vh, 0.75rem) var(--pixel); min-width: 7em; text-align: center; }
    .message-jeu.gagne { color: var(--vert); text-shadow: 0 0 8px var(--vert); }
    .message-jeu.perdu { color: var(--rouge); text-shadow: 0 0 8px var(--rouge); }

    .grille-mines {
      --taille: 30px;
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--taille));
      gap: 2px;
      padding: 6px;
      background: #000;
      border: 3px solid var(--cyan);
      box-shadow: 0 0 0 3px var(--nuit), 0 0 0 6px var(--cyan), 0 0 20px 3px rgba(25, 240, 255, 0.4);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .case {
      width: var(--taille); height: var(--taille);
      padding: 0; border: 0; cursor: pointer;
      font: calc(var(--taille) * 0.42) var(--pixel);
      display: grid; place-items: center;
      background: #1c1240;
      box-shadow: inset 3px 3px 0 #3b2a7a, inset -3px -3px 0 #0b0620;
      color: #fff;
    }
    .case:hover:not(.ouverte) { background: #2a1c5c; }
    .case.ouverte { background: #07030f; box-shadow: inset 0 0 0 1px #1a1130; cursor: default; }
    .case.depart:not(.ouverte) { animation: pulse 0.8s steps(2) infinite; }
    @keyframes pulse { 50% { background: #2f6f78; } }
    .case.boum { background: var(--rouge); box-shadow: 0 0 12px var(--rouge); }
    .case.faux { background: #3a1020; }
    .n1 { color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
    .n2 { color: var(--vert); text-shadow: 0 0 6px var(--vert); }
    .n3 { color: var(--rose); text-shadow: 0 0 6px var(--rose); }
    .n4 { color: var(--jaune); text-shadow: 0 0 6px var(--jaune); }
    .n5 { color: var(--orange); text-shadow: 0 0 6px var(--orange); }
    .n6 { color: #b388ff; text-shadow: 0 0 6px #b388ff; }
    .n7 { color: #fff; }
    .n8 { color: #9aa4c0; }


    .course { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; font-size: 1.1rem; min-height: 0; overflow: hidden; }
    .course li { display: grid; grid-template-columns: 1fr auto; gap: 0.1rem 0.5rem; }
    .course .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .course li.moi .nom { color: var(--jaune); }
    .course .etat { font: 0.5rem var(--pixel); align-self: center; }
    .course .barre-prog { grid-column: 1 / -1; height: 8px; background: #1c1240; border: 1px solid var(--cyan); }
    .course .barre-prog span { display: block; height: 100%; background: var(--cyan); }
    .course li.gagne .barre-prog span { background: var(--vert); }
    .course li.perdu .barre-prog span { background: var(--rouge); }
    @media (max-aspect-ratio: 1/1) {
      .course { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.3rem 1rem; }
      .course li { min-width: 120px; }
    }
  </style>
</head>
<body class="page-jeu">
  <header class="barre-jeu">
    <button id="btn-quitter" class="icone" aria-label="Quitter" title="Menu">◀</button>
    <h1 class="titre">DÉMINEUR</h1>
    <button id="btn-classement" class="icone" style="--c: var(--jaune)" aria-label="Classement" title="Classement">🏆</button>
  </header>

  <div class="outils">
    <div class="onglets" id="niveaux"></div>
    <span class="compteur" id="mines-restantes" title="Mines">000</span>
    <button id="btn-visage" class="icone" title="Nouvelle partie">🙂</button>
    <span class="compteur" id="chrono" title="Temps">000</span>
    <button id="btn-drapeau" class="icone" title="Drapeau">🚩</button>
    <span class="message-jeu" id="message"></span>
  </div>

  <div class="corps-jeu">
    <div class="zone-cadre"><div class="grille-mines" id="grille"></div></div>
    <aside class="panneau-lateral" id="panneau"><ul class="course" id="liste-course" hidden></ul></aside>
  </div>

  <div class="modal" id="modal-classement" hidden>
    <div class="modal-boite">
      <div class="barre-ecran"><h2 class="titre">🏆 DÉMINEUR</h2><button class="icone" data-fermer aria-label="Fermer">✕</button></div>
      <div id="classement"></div>
    </div>
  </div>

  <script src="../../lib/firebase-app-compat.js"></script>
  <script src="../../lib/firebase-database-compat.js"></script>
  <script src="../../lib/qrcode.js"></script>
  <script src="../../commun/reseau.js"></script>
  <script src="../../jeux.js"></script>
  <script src="../../commun/scores.js"></script>
  <script src="../../commun/page.js"></script>
  <script src="demineur.js"></script>
</body>
</html>
