<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau jeu — Rob</title>
  <link rel="stylesheet" href="../../style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    .zone-jeu {
      --c: var(--cyan);
      background: rgba(5, 1, 15, 0.9);
      padding: 2rem;
      min-height: 50vh;
      margin-top: 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      text-align: center;
    }
    .zone-jeu h2 { font: 1rem/1.6 var(--pixel); color: var(--rose); text-shadow: var(--halo-rose); }
    .joueurs { max-width: 420px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="zone-jeu">
      <h2>Nouveau jeu</h2>
      <p class="aide">Modèle : copie ce dossier pour commencer un nouveau mini-jeu.</p>
      <p>Lobby <strong id="code"></strong> — <span id="role"></span></p>
      <ul class="joueurs" id="liste-joueurs"></ul>

      <!-- Le jeu se construit ici -->

      <p id="message" class="message" role="status"></p>

      <!-- Tableau des scores de ce jeu (mis à jour en direct) -->
      <h2>🏆 Classement</h2>
      <div id="classement" class="zone-scores" style="--c: var(--jaune); max-width: 560px"></div>
      <button id="btn-retour" class="bouton" hidden>◀ Retour au lobby (tout le monde)</button>
    </div>
  </main>

  <script src="../../lib/firebase-app-compat.js"></script>
  <script src="../../lib/firebase-database-compat.js"></script>
  <script src="../../lib/qrcode.js"></script>
  <script src="../../commun/reseau.js"></script>
  <script src="../../jeux.js"></script>
  <script src="../../commun/scores.js"></script>
  <script>
    // ⚠ Nom du dossier de ce jeu (le même que dans jeux.js)
    const JEU = "_modele";

    /* Les joueurs arrivent ici depuis le lobby : ils sont déjà connectés.
       - s.code, s.id, s.nom : le lobby et moi
       - v.hote : l'id de l'hôte (c'est lui qui pilote la partie)
       - ref    : games/<CODE> dans Firebase — on peut y ranger l'état du jeu,
                  ex. ref.child("partie/question").set(...)
       - fin de partie : Scores.enregistrer(JEU, score)          → mon score
                         Scores.enregistrer(JEU, score, "Léa")   → le score d'un joueur
                         (le classement et le score total se mettent à jour tout seuls) */
    const $ = (x) => document.querySelector(x);
    const s = Reseau.session.lire();
    let parti = false; // on ne quitte la page qu'une fois
    const menu = () => { if (parti) return; parti = true; location.href = Reseau.racine; };

    if (!s) {
      $("#message").textContent = "Pas de lobby : retour au menu…";
      setTimeout(menu, 1500);
    } else {
      Reseau.reprendre(s).then(() => {
        const ref = Reseau.lobby(s.code);
        let lanceVu = false;
        $("#code").textContent = s.code;

        ref.on("value", (snap) => {
          const v = snap.val();
          if (!v) { Reseau.session.effacer(); menu(); return; }        // lobby fermé
          if (v.lancement) lanceVu = true;
          else if (lanceVu) { Reseau.garderPresence(s); menu(); return; } // l'hôte a ramené tout le monde au lobby

          const hote = v.hote === s.id;
          $("#role").textContent = hote ? "tu es l'hôte ★" : "invité";
          $("#btn-retour").hidden = !hote;
          const joueurs = Object.entries(v.joueurs || {}).sort((a, b) => (a[1].arrivee || 0) - (b[1].arrivee || 0));
          $("#liste-joueurs").replaceChildren(...joueurs.map(([id, j]) => {
            const li = document.createElement("li");
            if (id === v.hote) li.className = "hote";
            li.textContent = (id === v.hote ? "★ " : "") + j.nom + (id === s.id ? " (toi)" : "");
            return li;
          }));
        });

        // Classement de ce jeu, en direct
        Scores.ecouter((data) => Scores.tableau($("#classement"), data, JEU, Scores.cle(s.nom)));

        // L'hôte termine la partie : tout le monde revient dans le lobby
        $("#btn-retour").addEventListener("click", () => ref.child("lancement").remove());
      }).catch(() => {
        $("#message").textContent = "Ce lobby n'existe plus : retour au menu…";
        setTimeout(menu, 1500);
      });
    }
  </script>
</body>
</html>
