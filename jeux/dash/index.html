<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Néon Dash — Rob</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    #ov-texte { white-space: pre-line; text-align: left; }
    .barre-objet { flex: none; display: flex; justify-content: center; padding: 0 var(--marge) var(--marge); }
    #btn-objet {
      width: min(420px, 70vw); height: clamp(40px, 8vh, 58px); padding: 0;
      font: clamp(0.6rem, 2vh, 0.9rem) var(--pixel); color: var(--c); border: 3px solid var(--c);
      box-shadow: 0 0 14px var(--c); background: rgba(5, 1, 15, 0.8); touch-action: manipulation;
    }
    #btn-objet { display: flex; align-items: center; justify-content: center; gap: 0.8rem; }
    #btn-objet .reserve { font-size: 0.75em; opacity: 0.75; border-left: 2px solid #4a3a66; padding-left: 0.8rem; }
    #btn-objet:disabled { opacity: 0.35; box-shadow: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    /* Téléphone : affichage PAYSAGE compact (terrain le plus grand possible) ;
       tenu en hauteur, tout l'écran pivote (.pivote) : on tourne le téléphone */
    body.pivote {
      position: fixed; top: 0; left: 0;
      width: 100vh; width: 100dvh; height: 100vw;
      transform-origin: top left; transform: translateX(100vw) rotate(90deg);
    }
    body.paysage .barre-jeu { padding: 6px 10px 0; }
    body.paysage .barre-jeu .titre { font-size: calc(4 * var(--court)); }
    body.paysage .barre-jeu .icone { width: calc(10 * var(--court)); height: calc(10 * var(--court)); font-size: calc(4 * var(--court)); }
    body.paysage .corps-jeu { flex-direction: row; gap: 10px; padding: 8px 10px 10px; width: 100%; }
    body.paysage .panneau-lateral { width: calc(32 * var(--court)); flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; gap: 8px; }
    body.paysage .info-jeu { flex: none; min-width: 0; padding: 4px; }
    body.paysage .info-jeu .lib { font-size: calc(2.2 * var(--court)); }
    body.paysage .info-jeu .val { font-size: calc(2.8 * var(--court)); }
    body.paysage .salle { flex-direction: column; flex-wrap: nowrap; font-size: calc(3.6 * var(--court)); }
    body.paysage .panneau-lateral .barre-objet { margin-top: auto; padding: 0; }
    body.paysage #btn-objet { width: 100%; height: calc(14 * var(--court)); font-size: calc(3 * var(--court)); flex-direction: column; gap: 2px; }
    body.paysage #btn-objet .reserve { border-left: 0; padding-left: 0; }
    body.paysage .overlay h2 { font-size: calc(5 * var(--court)); }
    body.paysage .overlay p { font-size: calc(4.4 * var(--court)); }
    body.paysage .overlay .bouton { font-size: calc(3 * var(--court)); padding: calc(2 * var(--court)) calc(4 * var(--court)); }
  </style>
</head>
<body class="page-jeu">
  <header class="barre-jeu">
    <button id="btn-quitter" class="icone" aria-label="Quitter" title="Menu">◀</button>
    <h1 class="titre">NÉON DASH</h1>
    <button id="btn-classement" class="icone" style="--c: var(--jaune)" aria-label="Classement" title="Classement">🏆</button>
  </header>

  <div class="corps-jeu">
    <div class="zone-cadre">
      <div class="cadre-jeu" id="terrain" data-ratio="800/450" style="--c: var(--rose)">
        <canvas id="ecran" width="800" height="450"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="ov-titre"></h2>
          <p id="ov-texte"></p>
          <div class="boutons" id="ov-boutons"></div>
        </div>
      </div>
    </div>
    <aside class="panneau-lateral">
      <div class="info-jeu" style="--c: var(--jaune)"><span class="lib">Blocs</span><span class="val" id="score">0</span></div>
      <div class="info-jeu" style="--c: var(--cyan)"><span class="lib">Vitesse</span><span class="val" id="vitesse">0</span></div>
      <ul class="salle" id="liste-salle" hidden></ul>
    </aside>
  </div>

  <div class="barre-objet"><button id="btn-objet" aria-label="Utiliser l'objet" title="Objet (E)" disabled></button></div>

  <div class="modal" id="modal-classement" hidden>
    <div class="modal-boite">
      <div class="barre-ecran"><h2 class="titre">🏆 NÉON DASH</h2><button class="icone" data-fermer aria-label="Fermer">✕</button></div>
      <div id="classement"></div>
    </div>
  </div>

  <script src="../../lib/firebase-app-compat.js"></script>
  <script src="../../lib/firebase-database-compat.js"></script>
  <script src="../../lib/qrcode.js"></script>
  <script src="../../commun/reseau.js"></script>
  <script src="../../jeux.js"></script>
  <script src="../../commun/scores.js"></script>
  <script src="../../commun/salle.js"></script>
  <script src="../../commun/coop.js"></script>
  <script src="../../commun/page.js"></script>
  <script src="moteur.js"></script>
  <script>
    // téléphone (écran tactile) → affichage paysage compact ; tenu en hauteur → tout pivote
    (function () {
      const barre = document.querySelector(".barre-objet"), panneau = document.querySelector(".panneau-lateral");
      const finDeBody = barre.nextElementSibling;
      function orienter() {
        const p = matchMedia("(pointer: coarse)").matches;
        document.body.classList.toggle("paysage", p);
        document.body.classList.toggle("pivote", p && innerHeight > innerWidth);
        document.body.style.setProperty("--court", Math.min(innerWidth, innerHeight) / 100 + "px");
        if (p && barre.parentElement !== panneau) panneau.append(barre);
        if (!p && barre.parentElement === panneau) document.body.insertBefore(barre, finDeBody);
        if (window.Page) Page.ajuster();
      }
      addEventListener("resize", orienter);
      orienter();
    })();
  </script>
  <script src="dash.js"></script>
</body>
</html>
