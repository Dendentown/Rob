<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Invaders — Rob</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
</head>
<body class="page-jeu">
  <header class="barre-jeu">
    <button id="btn-quitter" class="icone" aria-label="Quitter" title="Menu">◀</button>
    <h1 class="titre">SPACE INVADERS</h1>
    <button id="btn-classement" class="icone" style="--c: var(--jaune)" aria-label="Classement" title="Classement">🏆</button>
  </header>

  <div class="corps-jeu">
    <div class="zone-cadre">
      <div class="cadre-jeu" id="terrain" data-ratio="480/540" style="--c: var(--vert)">
        <canvas id="ecran" width="480" height="540"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="ov-titre"></h2>
          <p id="ov-texte"></p>
          <div class="boutons" id="ov-boutons"></div>
        </div>
      </div>
    </div>
    <aside class="panneau-lateral">
      <div class="info-jeu" style="--c: var(--jaune)"><span class="lib">Score</span><span class="val" id="score">0</span></div>
      <div class="info-jeu" style="--c: var(--rose)"><span class="lib">Vies</span><span class="val" id="vies">0</span></div>
      <div class="info-jeu" style="--c: var(--cyan)"><span class="lib">Vague</span><span class="val" id="vague">0</span></div>
      <ul class="salle" id="liste-salle" hidden></ul>
    </aside>
  </div>
  <div class="commandes-tactiles">
    <button data-cmd="g" aria-label="Gauche">◀</button>
    <button data-cmd="feu" aria-label="Tirer" style="color: var(--jaune); border-color: var(--jaune)">✹</button>
    <button data-cmd="d" aria-label="Droite">▶</button>
  </div>
  <div class="modal" id="modal-classement" hidden>
    <div class="modal-boite">
      <div class="barre-ecran"><h2 class="titre">🏆 SPACE INVADERS</h2><button class="icone" data-fermer aria-label="Fermer">✕</button></div>
      <div id="classement"></div>
    </div>
  </div>

  <script src="../../lib/firebase-app-compat.js"></script>
  <script src="../../lib/firebase-database-compat.js"></script>
  <script src="../../lib/qrcode.js"></script>
  <script src="../../commun/reseau.js"></script>
  <script src="../../jeux.js"></script>
  <script src="../../commun/scores.js"></script>
  <script src="../../commun/salle.js"></script>
  <script src="../../commun/coop.js"></script>
  <script src="../../commun/page.js"></script>
  <script src="invaders.js"></script>
</body>
</html>
