<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rob — Mini-jeux</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='20' width='60' height='60' fill='%2319f0ff'/><rect x='35' y='35' width='30' height='30' fill='%23ff2bd6'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="entete"><h1 class="titre" id="nom-plateforme">ROB</h1></header>

  <main class="ecrans">
    <!-- MENU -->
    <section id="ecran-menu" class="ecran">
      <div class="colonne">
        <input id="pseudo" class="champ" maxlength="16" autocomplete="off" placeholder="PSEUDO" aria-label="Pseudo" />
        <div class="score-total">
          <span class="lib">SCORE</span>
          <span class="val" id="score-total">—</span>
          <span class="rang" id="rang-total"></span>
        </div>
        <button id="btn-creer" class="bouton" type="button">Créer un lobby</button>
        <form id="form-rejoindre" class="ligne">
          <input id="code" class="champ" maxlength="8" autocomplete="off" placeholder="CODE" aria-label="Code du lobby" />
          <button type="submit" class="bouton secondaire">Rejoindre</button>
        </form>
        <button id="btn-classements" class="bouton secondaire" type="button" style="--c: var(--jaune); color: var(--jaune)">🏆 Classements</button>
        <p id="msg-menu" class="message" role="status"></p>
      </div>
    </section>

    <!-- CLASSEMENTS -->
    <section id="ecran-classements" class="ecran" hidden>
      <div class="barre-ecran">
        <button id="btn-retour-menu" class="icone" aria-label="Retour">◀</button>
        <h2 class="titre">🏆 Classements</h2>
      </div>
      <nav class="onglets" id="onglets"></nav>
      <div class="bloc bloc-scores" id="tableau-scores"></div>
    </section>

    <!-- LOBBY -->
    <section id="ecran-lobby" class="ecran" hidden>
      <div class="barre-ecran">
        <button id="btn-quitter" class="icone" aria-label="Quitter le lobby">◀</button>
        <h2 class="titre">Lobby</h2>
      </div>
      <div class="lobby">
        <div class="bloc bloc-code">
          <div class="gros-code" id="lobby-code"></div>
          <div class="qr" id="lobby-qr"></div>
          <button id="btn-copier" class="icone" aria-label="Copier le lien" title="Copier le lien">⧉</button>
        </div>
        <div class="bloc bloc-joueurs">
          <div class="entete-bloc"><span>JOUEURS</span><span id="nb-joueurs">0</span></div>
          <ul class="puces" id="liste-joueurs"></ul>
        </div>
        <div class="bloc bloc-jeux">
          <div class="tuiles" id="tuiles"></div>
          <button id="btn-lancer" class="bouton" disabled>Lancer ▶</button>
        </div>
      </div>
      <p id="msg-lobby" class="message" role="status"></p>
    </section>
  </main>

  <script src="lib/firebase-app-compat.js"></script>
  <script src="lib/firebase-database-compat.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="commun/reseau.js"></script>
  <script src="commun/scores.js"></script>
  <script src="jeux.js"></script>
  <script src="app.js"></script>
</body>
</html>
